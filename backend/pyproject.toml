[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlabeller"
version = "0.2.0"
description = "Local backend for OpenLabeller: image/text/audio labeling annotation logic served over a REST API"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OpenLabeller contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "Pillow>=10.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pyinstaller>=6.0"]

[project.scripts]
openlabeller-server = "openlabeller.__main__:main"

[tool.setuptools.packages.find]
include = ["openlabeller*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
